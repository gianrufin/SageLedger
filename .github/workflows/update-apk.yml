name: Build & Update APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'apk/**'
      - '**.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Materialize Google services config
        id: config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ -f app/google-services.json ]; then
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
            echo "Google services config is unavailable. The signed APK will not be published."
          fi

      - name: Prepare release signing key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/sageledger-upload.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. The workflow will run tests but will not publish a debug APK."
          fi

      - name: Compute build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER_NAME=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          else
            VER_NAME="1.0.$((GITHUB_RUN_NUMBER + 13))"
          fi
          VER_CODE=$((GITHUB_RUN_NUMBER + 20))
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build signed release APK
        if: steps.config.outputs.has_google_services == 'true' && steps.signing.outputs.has_release_signing == 'true'
        env:
          SAGE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SAGE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PsageVersionName="$SAGE_VERSION_NAME" \
            -PsageVersionCode="$SAGE_VERSION_CODE"

      - name: Update APK download folder
        if: steps.config.outputs.has_google_services == 'true' && steps.signing.outputs.has_release_signing == 'true'
        env:
          SAGE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SAGE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/SageLedger-latest.apk
          python3 - <<'PY'
          import json
          import os

          version_name = os.environ["SAGE_VERSION_NAME"]
          payload = {
              "versionName": version_name,
              "versionCode": int(os.environ["SAGE_VERSION_CODE"]),
              "apkFile": "SageLedger-latest.apk",
              "notes": f"Automated GitHub build v{version_name} (commit {os.environ['COMMIT_SHA'][:7]}).",
          }
          with open("apk/version.json", "w", encoding="utf-8") as manifest:
              json.dump(payload, manifest, indent=2)
              manifest.write("\n")
          PY

      - name: Commit updated APK to repo
        if: github.event_name != 'release' && steps.config.outputs.has_google_services == 'true' && steps.signing.outputs.has_release_signing == 'true'
        env:
          SAGE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/SageLedger-latest.apk apk/version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): update SageLedger-latest.apk to v$SAGE_VERSION_NAME"
            git push
          fi

      - name: Upload signed APK workflow artifact
        if: steps.config.outputs.has_google_services == 'true' && steps.signing.outputs.has_release_signing == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: SageLedger-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
