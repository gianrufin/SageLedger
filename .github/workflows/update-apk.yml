name: Build & Update APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'apk/**'
      - '**.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Materialize debug keystore & Google services config
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Compute build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VER_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          VER_CODE=$((GITHUB_RUN_NUMBER + 1))
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            -PsageVersionName="${{ steps.version.outputs.version_name }}" \
            -PsageVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Update apk download folder
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/SageLedger-latest.apk
          cat <<EOF > apk/version.json
          {
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "apkFile": "SageLedger-latest.apk",
            "notes": "Automated GitHub build v${{ steps.version.outputs.version_name }} (commit ${GITHUB_SHA::7})."
          }
          EOF

      - name: Commit updated APK to repo
        if: github.event_name != 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/SageLedger-latest.apk apk/version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): update SageLedger-latest.apk to v${{ steps.version.outputs.version_name }}"
            git push
          fi

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: SageLedger-v${{ steps.version.outputs.version_name }}
          path: apk/SageLedger-latest.apk
